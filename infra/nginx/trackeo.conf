server {
    listen 80;
    listen [::]:80;
    server_name trackeo.zenkai.mg api.trackeo.zenkai.mg app.trackeo.zenkai.mg traccar.trackeo.zenkai.mg admin.trackeo.zenkai.mg office.trackeo.zenkai.mg;
    root /opt/trackeo/landing;
    location /.well-known/acme-challenge { allow all; }
    location / { return 301 https://$host$request_uri; }
}

# Landing Page
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trackeo.zenkai.mg;

    ssl_certificate /etc/letsencrypt/live/trackeo.zenkai.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackeo.zenkai.mg/privkey.pem;

    root /opt/trackeo/landing;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}

# Web App
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.trackeo.zenkai.mg;

    ssl_certificate /etc/letsencrypt/live/trackeo.zenkai.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackeo.zenkai.mg/privkey.pem;

    root /opt/trackeo/web;
    index index.html;

    # Flutter utilise des noms de bundles stables. Ces fichiers doivent être
    # revalidés à chaque ouverture pour éviter qu'une ancienne PWA reste figée.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location ~ ^/(flutter_service_worker\.js|flutter_bootstrap\.js|main\.dart\.js|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# Admin (Office) - Proxy to Next.js container
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.trackeo.zenkai.mg office.trackeo.zenkai.mg;

    ssl_certificate /etc/letsencrypt/live/trackeo.zenkai.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackeo.zenkai.mg/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}

  # API
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.trackeo.zenkai.mg;

    ssl_certificate /etc/letsencrypt/live/trackeo.zenkai.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackeo.zenkai.mg/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Original-Uri $request_uri;
    }
  }

# Traccar
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name traccar.trackeo.zenkai.mg;

    ssl_certificate /etc/letsencrypt/live/trackeo.zenkai.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackeo.zenkai.mg/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}