name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

# ===========================================
# JOBS
# ===========================================
jobs:
  # ═══════════════════════════════════════
  # STEP 1: LINT
  # ═══════════════════════════════════════
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        run: cd apps/api && npm ci

      - name: Run API Lint
        run: cd apps/api && npm run lint

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Install Flutter dependencies
        run: cd apps/mobile && flutter pub get

      - name: Run Flutter Analyze
        run: cd apps/mobile && flutter analyze

  # ═══════════════════════════════════════
  # STEP 2: TEST
  # ═══════════════════════════════════════
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: timescale/timescaledb:latest-pg14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: cd apps/api && npm ci

      - name: Build API
        run: cd apps/api && npm run build
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASS: test
          DB_NAME: test

      - name: Run API Tests
        run: cd apps/api && npm run test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASS: test
          DB_NAME: test

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Install Flutter dependencies
        run: cd apps/mobile && flutter pub get

      - name: Run Flutter Tests
        run: cd apps/mobile && flutter test

  # ═══════════════════════════════════════
  # STEP 3: BUILD
  # ═══════════════════════════════════════
  build:
    name: 📦 Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: cd apps/api && npm ci

      - name: Build API
        run: cd apps/api && npm run build

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Install Flutter dependencies
        run: cd apps/mobile && flutter pub get

      - name: Build Flutter Web
        run: cd apps/mobile && flutter build web --release

  # ═══════════════════════════════════════
  # STEP 4: NOTIFY
  # ═══════════════════════════════════════
  notify:
    name: ✅ Notify
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Create status summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Set failure status
        if: failure()
        run: |
          echo "❌ CI Failed! Please check the errors above."
          exit 1