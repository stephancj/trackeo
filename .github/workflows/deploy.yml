name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy'
        required: true
        default: 'api'
        type: choice
        options:
          - api
          - web
          - landing
          - infra
          - all

jobs:
  # ===========================================
  # CHECK CHANGES
  # ===========================================
  check-changes:
    name: Check changes
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.changes.outputs.api }}
      web_changed: ${{ steps.changes.outputs.web }}
      ios_changed: ${{ steps.changes.outputs.ios }}
      infra_changed: ${{ steps.changes.outputs.infra }}
      landing_changed: ${{ steps.changes.outputs.landing }}
      admin_changed: ${{ steps.changes.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for API changes
        id: changes
        run: |
          # Get the base commit (handle first push case)
          BASE_REF=${{ github.event.before }}
          if [ -z "$BASE_REF" ]; then
            BASE_REF=$(git rev-list --max-parents=0 HEAD)
          fi
          
          # Get the list of changed files
          CHANGED_FILES=$(git diff --name-only $BASE_REF HEAD)
          
          # Check each project
          if echo "$CHANGED_FILES" | grep -qE '^apps/api/'; then echo "api=true" >> $GITHUB_OUTPUT; else echo "api=false" >> $GITHUB_OUTPUT; fi
          if echo "$CHANGED_FILES" | grep -qE '^apps/mobile/'; then echo "web=true" >> $GITHUB_OUTPUT; else echo "web=false" >> $GITHUB_OUTPUT; fi
          if echo "$CHANGED_FILES" | grep -qE '^apps/admin/'; then echo "admin=true" >> $GITHUB_OUTPUT; else echo "admin=false" >> $GITHUB_OUTPUT; fi
          if echo "$CHANGED_FILES" | grep -qE '^apps/landing/'; then echo "landing=true" >> $GITHUB_OUTPUT; else echo "landing=false" >> $GITHUB_OUTPUT; fi
          if echo "$CHANGED_FILES" | grep -qE '^(infra/|docker-compose\.yml|infra/nginx/)'; then echo "infra=true" >> $GITHUB_OUTPUT; else echo "infra=false" >> $GITHUB_OUTPUT; fi
          echo "ios=false" >> $GITHUB_OUTPUT

  # ===========================================
  # BUILD API (on VPS, no Docker Hub push needed)
  # ===========================================
  build-api:
    name: Build API
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.api_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build API on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            docker-compose build api
          "

  # ===========================================
  # BUILD WEB
  # ===========================================
  build-web:
    name: Build Web
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.web_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Install dependencies
        run: cd apps/mobile && flutter pub get

      - name: Build
        run: cd apps/mobile && flutter build web --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/mobile/build/web
          retention-days: 7

  # ===========================================
  # DEPLOY API
  # ===========================================
  deploy-api:
    name: Deploy API
    needs: [check-changes, build-api]
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.api_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy API
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            git pull origin main &&
            docker-compose up -d --build api
          "

      - name: Wait for API
        run: sleep 20

      - name: Test API
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            curl -sf https://api.trackeo.zenkai.mg/health || curl -sf https://api.trackeo.zenkai.mg/ || exit 1
          "

  # ===========================================
  # DEPLOY WEB
  # ===========================================
  deploy-web:
    name: Deploy Web
    needs: [check-changes, build-web]
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.web_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Web
        run: |
          scp -o StrictHostKeyChecking=no -r web/* ${{ secrets.VPS_HOST }}:/opt/trackeo/web/
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "chmod -R 755 /opt/trackeo/web && chown -R www-data:www-data /opt/trackeo/web"

  # ===========================================
  # BUILD ADMIN
  # ===========================================
  build-admin:
    name: Build Admin
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.admin_changed == 'true' || needs.check-changes.outputs.infra_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        run: cd apps/admin && npm ci

      - name: Build
        run: cd apps/admin && npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: apps/admin/.next
          retention-days: 7

  # ===========================================
  # DEPLOY ADMIN
  # ===========================================
  deploy-admin:
    name: Deploy Admin
    needs: [check-changes, build-admin]
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.admin_changed == 'true' || needs.check-changes.outputs.infra_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-build
          path: admin

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Admin
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            docker rm -f trackeo-admin 2>/dev/null || true &&
            docker build -t trackeo_admin admin &&
            docker run -d --name trackeo-admin --network trackeo_trackeo-net -p 3001:3000 trackeo_admin
          "

  # ===========================================
  # BUILD LANDING
  # ===========================================
  build-landing:
    name: Build Landing
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.landing_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/landing/package-lock.json

      - name: Install dependencies
        run: cd apps/landing && npm install

      - name: Build
        run: cd apps/landing && npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-build
          path: apps/landing/dist
          retention-days: 7

  # ===========================================
  # DEPLOY LANDING
  # ===========================================
  deploy-landing:
    name: Deploy Landing
    needs: [check-changes, build-landing]
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.landing_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: landing-build
          path: landing

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Landing
        run: |
          scp -o StrictHostKeyChecking=no -r landing/* ${{ secrets.VPS_HOST }}:/opt/trackeo/landing/
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "chmod -R 755 /opt/trackeo/landing && chown -R www-data:www-data /opt/trackeo/landing"

  # ===========================================
  # DEPLOY INFRA
  # ===========================================
  deploy-infra:
    name: Deploy Infrastructure
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.infra_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Infrastructure
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            docker-compose pull &&
            docker rm -f trackeo-api trackeo-admin 2>/dev/null || true &&
            docker-compose up -d --no-recreate 2>/dev/null || (
              docker rm -f trackeo-api 2>/dev/null || true &&
              docker run -d --name trackeo-api --network trackeo_trackeo-net -p 3000:3000 -e DB_HOST=postgres -e DB_PORT=5432 -e DB_USER=trackeo -e DB_PASS=Password_1234 -e DB_NAME=traccar_db -e PORT=3000 trackeo_api
            )
          "

  # ===========================================
  # DEPLOY IOS (Manual - requires Fastlane Match setup)
  # ===========================================
  deploy-ios:
    name: Deploy iOS (Manual)
    needs: check-changes
    runs-on: ubuntu-latest
    if: false # Disabled - requires Fastlane Match to be set up first
    steps:
      - run: echo "iOS deployment requires Fastlane Match to be configured first"

  # ===========================================
  # NOTIFICATION
  # ===========================================
  notify:
    name: Notify
    needs: [check-changes, deploy-api, deploy-web, deploy-admin, deploy-landing, deploy-infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Deploy Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Changes detected:" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${{ needs.check-changes.outputs.api_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Web App: ${{ needs.check-changes.outputs.web_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Admin: ${{ needs.check-changes.outputs.admin_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Landing: ${{ needs.check-changes.outputs.landing_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- iOS: Skipped (Fastlane Match not configured)" >> $GITHUB_STEP_SUMMARY
          echo "- Infra: ${{ needs.check-changes.outputs.infra_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy API | ${{ needs.deploy-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Web | ${{ needs.deploy-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Admin | ${{ needs.deploy-admin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Landing | ${{ needs.deploy-landing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy iOS | Skipped |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Infra | ${{ needs.deploy-infra.result }} |" >> $GITHUB_STEP_SUMMARY