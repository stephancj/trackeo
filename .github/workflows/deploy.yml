name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - api
          - web
          - ios
          - admin
          - landing
          - infra
          - all

jobs:
  # ===========================================
  # DETECT CHANGES & COMPUTE DEPLOY TARGETS
  # ===========================================
  check-changes:
    name: Check changes
    runs-on: ubuntu-latest
    outputs:
      deploy_api: ${{ steps.targets.outputs.deploy_api }}
      deploy_web: ${{ steps.targets.outputs.deploy_web }}
      deploy_ios: ${{ steps.targets.outputs.deploy_ios }}
      deploy_admin: ${{ steps.targets.outputs.deploy_admin }}
      deploy_landing: ${{ steps.targets.outputs.deploy_landing }}
      deploy_infra: ${{ steps.targets.outputs.deploy_infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            api:
              - 'apps/api/**'
            mobile:
              - 'apps/mobile/**'
            admin:
              - 'apps/admin/**'
            landing:
              - 'apps/landing/**'
            infra:
              - 'infra/**'
              - 'docker compose.yml'

      - name: Compute deploy targets
        id: targets
        run: |
          EVENT="${{ github.event_name }}"
          TARGET="${{ github.event.inputs.deploy_target }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "deploy_api=$( [ "$TARGET" = "api" ] || [ "$TARGET" = "all" ] && echo true || echo false )" >> $GITHUB_OUTPUT
            echo "deploy_web=$( [ "$TARGET" = "web" ] || [ "$TARGET" = "all" ] && echo true || echo false )" >> $GITHUB_OUTPUT
            echo "deploy_ios=$( [ "$TARGET" = "ios" ] || [ "$TARGET" = "all" ] && echo true || echo false )" >> $GITHUB_OUTPUT
            echo "deploy_admin=$( [ "$TARGET" = "admin" ] || [ "$TARGET" = "all" ] && echo true || echo false )" >> $GITHUB_OUTPUT
            echo "deploy_landing=$( [ "$TARGET" = "landing" ] || [ "$TARGET" = "all" ] && echo true || echo false )" >> $GITHUB_OUTPUT
            echo "deploy_infra=$( [ "$TARGET" = "infra" ] || [ "$TARGET" = "all" ] && echo true || echo false )" >> $GITHUB_OUTPUT
          else
            echo "deploy_api=${{ steps.filter.outputs.api }}" >> $GITHUB_OUTPUT
            echo "deploy_web=${{ steps.filter.outputs.mobile }}" >> $GITHUB_OUTPUT
            echo "deploy_ios=${{ steps.filter.outputs.mobile }}" >> $GITHUB_OUTPUT
            echo "deploy_admin=${{ steps.filter.outputs.admin }}" >> $GITHUB_OUTPUT
            echo "deploy_landing=${{ steps.filter.outputs.landing }}" >> $GITHUB_OUTPUT
            echo "deploy_infra=${{ steps.filter.outputs.infra }}" >> $GITHUB_OUTPUT
          fi

      - name: Log deploy targets
        run: |
          echo "## Deploy targets" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${{ steps.targets.outputs.deploy_api }}" >> $GITHUB_STEP_SUMMARY
          echo "- Web: ${{ steps.targets.outputs.deploy_web }}" >> $GITHUB_STEP_SUMMARY
          echo "- iOS: ${{ steps.targets.outputs.deploy_ios }}" >> $GITHUB_STEP_SUMMARY
          echo "- Admin: ${{ steps.targets.outputs.deploy_admin }}" >> $GITHUB_STEP_SUMMARY
          echo "- Landing: ${{ steps.targets.outputs.deploy_landing }}" >> $GITHUB_STEP_SUMMARY
          echo "- Infra: ${{ steps.targets.outputs.deploy_infra }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================
  # DEPLOY API (docker compose on VPS)
  # ===========================================
  deploy-api:
    name: Deploy API
    needs: check-changes
    if: needs.check-changes.outputs.deploy_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy API via docker compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            git pull origin main &&
            docker compose up -d --build api
          "

      - name: Health check
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} '
            for i in 1 2 3 4 5 6; do
              sleep 10
              if curl -sf https://api.trackeo.zenkai.mg/health 2>/dev/null || curl -sf https://api.trackeo.zenkai.mg/ 2>/dev/null; then
                echo "API is healthy"
                exit 0
              fi
              echo "Attempt $i failed, retrying..."
            done
            echo "Health check failed after 6 attempts"
            exit 1
          '

  # ===========================================
  # BUILD WEB (Flutter web on GH runner)
  # ===========================================
  build-web:
    name: Build Web
    needs: check-changes
    if: needs.check-changes.outputs.deploy_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - run: cd apps/mobile && flutter pub get
      - run: cd apps/mobile && flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/mobile/build/web
          retention-days: 7

  # ===========================================
  # DEPLOY WEB (static files to VPS)
  # ===========================================
  deploy-web:
    name: Deploy Web
    needs: [check-changes, build-web]
    if: needs.check-changes.outputs.deploy_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web

      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy static files
        run: |
          scp -o StrictHostKeyChecking=no -r web/* ${{ secrets.VPS_HOST }}:/opt/trackeo/web/
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "chmod -R 755 /opt/trackeo/web && chown -R www-data:www-data /opt/trackeo/web"

  # ===========================================
  # DEPLOY ADMIN (docker compose on VPS)
  # ===========================================
  deploy-admin:
    name: Deploy Admin
    needs: check-changes
    if: needs.check-changes.outputs.deploy_admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Admin via docker compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            git pull origin main &&
            docker compose up -d --build admin
          "

      - name: Health check
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} '
            for i in 1 2 3 4 5; do
              sleep 10
              if curl -sf http://localhost:3001 2>/dev/null; then
                echo "Admin is healthy"
                exit 0
              fi
              echo "Attempt $i failed, retrying..."
            done
            echo "Health check failed after 5 attempts"
            exit 1
          '

  # ===========================================
  # BUILD LANDING (on GH runner)
  # ===========================================
  build-landing:
    name: Build Landing
    needs: check-changes
    if: needs.check-changes.outputs.deploy_landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/landing/package-lock.json

      - run: cd apps/landing && npm install
      - run: cd apps/landing && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: landing-build
          path: apps/landing/dist
          retention-days: 7

  # ===========================================
  # DEPLOY LANDING (static files to VPS)
  # ===========================================
  deploy-landing:
    name: Deploy Landing
    needs: [check-changes, build-landing]
    if: needs.check-changes.outputs.deploy_landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: landing-build
          path: landing

      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy static files
        run: |
          scp -o StrictHostKeyChecking=no -r landing/* ${{ secrets.VPS_HOST }}:/opt/trackeo/landing/
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "chmod -R 755 /opt/trackeo/landing && chown -R www-data:www-data /opt/trackeo/landing"

  # ===========================================
  # DEPLOY INFRA (docker compose on VPS)
  # ===========================================
  deploy-infra:
    name: Deploy Infrastructure
    needs: check-changes
    if: needs.check-changes.outputs.deploy_infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy infrastructure via docker compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            git pull origin main &&
            docker compose pull &&
            docker compose up -d
          "

      - name: Health check
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} '
            for i in 1 2 3 4 5 6; do
              sleep 10
              if curl -sf https://api.trackeo.zenkai.mg/health 2>/dev/null || curl -sf https://api.trackeo.zenkai.mg/ 2>/dev/null; then
                echo "Infrastructure is healthy"
                exit 0
              fi
              echo "Attempt $i failed, retrying..."
            done
            echo "Health check failed after 6 attempts"
            exit 1
          '

  # ===========================================
  # DEPLOY iOS (TestFlight via Fastlane)
  # ===========================================
  deploy-ios:
    name: Deploy iOS (TestFlight)
    needs: check-changes
    if: needs.check-changes.outputs.deploy_ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/mobile

      - run: cd apps/mobile && bundle install
      - run: cd apps/mobile && flutter pub get
      - run: cd apps/mobile/ios && pod install

      - name: Increment build number
        run: |
          cd apps/mobile
          BUILD_NUMBER=${{ github.run_number }}
          echo "Build number: $BUILD_NUMBER"
          sed -i '' "s/^version: \(.*\)+.*/version: \1+$BUILD_NUMBER/" pubspec.yaml
          cat pubspec.yaml | grep "^version:"

      - name: Write API key to file
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p apps/mobile/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > apps/mobile/private_keys/AuthKey.p8

      - name: Build & Upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/apps/mobile/private_keys/AuthKey.p8
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: cd apps/mobile && bundle exec fastlane ios release

  # ===========================================
  # NOTIFICATION
  # ===========================================
  notify:
    name: Deploy Summary
    needs: [check-changes, deploy-api, deploy-web, deploy-admin, deploy-landing, deploy-infra, deploy-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Deploy Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API | ${{ needs.check-changes.outputs.deploy_api }} | ${{ needs.deploy-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web | ${{ needs.check-changes.outputs.deploy_web }} | ${{ needs.deploy-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin | ${{ needs.check-changes.outputs.deploy_admin }} | ${{ needs.deploy-admin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Landing | ${{ needs.check-changes.outputs.deploy_landing }} | ${{ needs.deploy-landing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | ${{ needs.check-changes.outputs.deploy_ios }} | ${{ needs.deploy-ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Infra | ${{ needs.check-changes.outputs.deploy_infra }} | ${{ needs.deploy-infra.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any deploy failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "One or more deploy jobs failed"
          exit 1
