name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy'
        required: true
        default: 'api'
        type: choice
        options:
          - api
          - web
          - infra
          - all

jobs:
  # ===========================================
  # CHECK CHANGES
  # ===========================================
  check-changes:
    name: Check changes
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.changes.outputs.api }}
      web_changed: ${{ steps.changes.outputs.web }}
      ios_changed: ${{ steps.changes.outputs.ios }}
      infra_changed: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for API changes
        id: changes
        run: |
          # For testing: always run all jobs
          echo "api=true" >> $GITHUB_OUTPUT
          echo "web=true" >> $GITHUB_OUTPUT
          echo "ios=true" >> $GITHUB_OUTPUT
          echo "infra=true" >> $GITHUB_OUTPUT

  # ===========================================
  # BUILD API (on VPS, no Docker Hub push needed)
  # ===========================================
  build-api:
    name: Build API
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.api_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build API on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            docker-compose build api
          "

  # ===========================================
  # BUILD WEB
  # ===========================================
  build-web:
    name: Build Web
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.web_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Install dependencies
        run: cd apps/mobile && flutter pub get

      - name: Build
        run: cd apps/mobile && flutter build web --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/mobile/build/web
          retention-days: 7

  # ===========================================
  # DEPLOY API
  # ===========================================
  deploy-api:
    name: Deploy API
    needs: [check-changes, build-api]
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.api_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy API
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            docker-compose stop api && docker-compose rm -f api && docker-compose up -d --no-recreate api
          "

      - name: Wait for API
        run: sleep 10

      - name: Test API
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            curl -sf https://api.trackeo.zenkai.mg/api/ || exit 1
          "

  # ===========================================
  # DEPLOY WEB
  # ===========================================
  deploy-web:
    name: Deploy Web
    needs: [check-changes, build-web]
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.web_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Web
        run: |
          scp -o StrictHostKeyChecking=no -r web/* ${{ secrets.VPS_HOST }}:/opt/trackeo/web/
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "chmod -R 755 /opt/trackeo/web && chown -R www-data:www-data /opt/trackeo/web"

  # ===========================================
  # DEPLOY INFRA
  # ===========================================
  deploy-infra:
    name: Deploy Infrastructure
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.infra_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Infrastructure
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            docker-compose pull &&
            docker-compose up -d --no-recreate
          "

  # ===========================================
  # DEPLOY IOS (Manual - requires Fastlane Match setup)
  # ===========================================
  deploy-ios:
    name: Deploy iOS (Manual)
    needs: check-changes
    runs-on: ubuntu-latest
    if: false # Disabled - requires Fastlane Match to be set up first
    steps:
      - run: echo "iOS deployment requires Fastlane Match to be configured first"

  # ===========================================
  # NOTIFICATION
  # ===========================================
  notify:
    name: Notify
    needs: [check-changes, deploy-api, deploy-web, deploy-infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Deploy Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Changes detected:" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${{ needs.check-changes.outputs.api_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Web: ${{ needs.check-changes.outputs.web_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- iOS: Skipped (Fastlane Match not configured)" >> $GITHUB_STEP_SUMMARY
          echo "- Infra: ${{ needs.check-changes.outputs.infra_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy API | ${{ needs.deploy-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Web | ${{ needs.deploy-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy iOS | Skipped |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Infra | ${{ needs.deploy-infra.result }} |" >> $GITHUB_STEP_SUMMARY