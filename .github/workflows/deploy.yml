name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy'
        required: true
        default: 'api'
        type: choice
        options:
          - api
          - web
          - infra
          - all

jobs:
  # ===========================================
  # BUILD API
  # ===========================================
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.changed_files, 'apps/api/'))
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: stephancj/trackeo-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # BUILD WEB
  # ===========================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.changed_files, 'apps/mobile/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24'
          cache: true

      - name: Install dependencies
        run: cd apps/mobile && flutter pub get

      - name: Build
        run: cd apps/mobile && flutter build web --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/mobile/build/web
          retention-days: 7

  # ===========================================
  # DEPLOY API
  # ===========================================
  deploy-api:
    name: Deploy API
    needs: build-api
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.changed_files, 'apps/api/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy API
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            git pull origin main &&
            docker-compose pull api &&
            docker-compose up -d api
          "

  # ===========================================
  # DEPLOY WEB
  # ===========================================
  deploy-web:
    name: Deploy Web
    needs: build-web
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.changed_files, 'apps/mobile/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Web
        run: |
          scp -o StrictHostKeyChecking=no -r web/* ${{ secrets.VPS_HOST }}:/opt/trackeo/web/

  # ===========================================
  # DEPLOY INFRA
  # ===========================================
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && 
       (contains(github.changed_files, 'docker-compose.yml') || 
        contains(github.changed_files, 'infra/')))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Infrastructure
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            git pull origin main &&
            docker-compose pull &&
            docker-compose up -d
          "

  # ===========================================
  # NOTIFICATION
  # ===========================================
  notify:
    name: Notify
    needs: [deploy-api, deploy-web, deploy-infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send success notification
        if: needs.deploy-api.result == 'success' || needs.deploy-web.result == 'success'
        run: |
          echo "Deployment successful!"

      - name: Send failure notification
        if: needs.deploy-api.result == 'failure' || needs.deploy-web.result == 'failure'
        run: |
          echo "Deployment failed!"
          exit 1