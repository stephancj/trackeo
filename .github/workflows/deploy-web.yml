name: Deploy Web

on:
  push:
    paths:
      - 'apps/mobile/**'
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24'

      - name: Install dependencies
        run: cd apps/mobile && flutter pub get

      - name: Build
        run: cd apps/mobile && flutter build web --release

      - name: Setup SSH
        uses: webfactory/ssh-agent@latest
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Web via SSH
        run: |
          scp -o StrictHostKeyChecking=no -r apps/mobile/build/web/* ${{ secrets.VPS_HOST }}:/opt/trackeo/web/