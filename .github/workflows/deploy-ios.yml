name: Deploy iOS to TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Install dependencies
        run: cd apps/mobile && flutter pub get

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install CocoaPods
        run: cd apps/mobile/ios && pod install

      - name: Build iOS
        run: cd apps/mobile && flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          cd apps/mobile/build/ios
          zip -r Runner.ipa Release-iphoneos/Runner.app

      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun altool --upload-app -f apps/mobile/build/ios/Runner.ipa \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

  notify:
    name: Notify
    needs: build-ios
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## iOS TestFlight Build" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.build-ios.result }}" >> $GITHUB_STEP_SUMMARY