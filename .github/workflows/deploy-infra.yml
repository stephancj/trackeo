name: Deploy Infra

on:
  push:
    paths:
      - 'infra/**'
      - 'docker-compose.yml'
      - '!.github/workflows/**'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@latest
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Infra via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            git pull origin main &&
            docker-compose down &&
            docker-compose up -d
          "