<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F4F5F7"/>
  <rect x="36" y="36" width="1128" height="558" rx="40" fill="url(#slab)"/>
  <rect x="36.5" y="36.5" width="1127" height="557" rx="39.5" stroke="white" stroke-opacity="0.09"/>

  <!-- streets -->
  <g stroke="white" stroke-opacity="0.06" stroke-width="2">
    <line x1="700" y1="36" x2="700" y2="594"/>
    <line x1="860" y1="36" x2="860" y2="594"/>
    <line x1="1020" y1="36" x2="1020" y2="594"/>
    <line x1="640" y1="160" x2="1164" y2="160"/>
    <line x1="640" y1="320" x2="1164" y2="320"/>
    <line x1="640" y1="470" x2="1164" y2="470"/>
  </g>

  <!-- geofence -->
  <circle cx="970" cy="210" r="110" fill="#5B8DEF" fill-opacity="0.1"/>
  <circle cx="970" cy="210" r="110" stroke="#5B8DEF" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="6 12" stroke-linecap="round"/>

  <!-- route -->
  <path d="M700 520 L700 400 L800 400 L800 300 L880 300 L880 210 L970 210" stroke="url(#route)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="700" cy="520" r="10" fill="#F59E0B"/>
  <circle cx="970" cy="210" r="34" fill="#4ECB8D" fill-opacity="0.25"/>
  <circle cx="970" cy="210" r="17" fill="#4ECB8D"/>
  <circle cx="970" cy="210" r="6" fill="#272838"/>

  <!-- brand -->
  <rect x="104" y="104" width="84" height="84" rx="24" fill="#E8F8F2"/>
  <path d="M146 122c-16.57 0-30 13.43-30 30 0 21.25 30 50 30 50s30-28.75 30-50c0-16.57-13.43-30-30-30Zm0 43.13a13.12 13.12 0 1 1 0-26.25 13.12 13.12 0 0 1 0 26.25Z" fill="#333549"/>

  <text x="104" y="296" fill="#FBFCFD" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">Vos véhicules,</text>
  <text x="104" y="372" fill="#4ECB8D" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">en direct.</text>

  <text x="104" y="436" fill="#ADB0C0" font-family="Arial, Helvetica, sans-serif" font-size="27">Carte en temps réel, alertes WhatsApp et historique</text>
  <text x="104" y="474" fill="#ADB0C0" font-family="Arial, Helvetica, sans-serif" font-size="27">des trajets. Pensé pour Madagascar.</text>

  <!-- telemetry -->
  <text x="104" y="546" fill="#7F8296" font-family="Courier New, monospace" font-size="20" letter-spacing="3">TRACKEO — -18.8792° S · 47.5079° E · MAJ 10 S</text>
  <circle cx="568" cy="539" r="6" fill="#4ECB8D"/>

  <defs>
    <linearGradient id="slab" x1="120" y1="60" x2="1080" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A3C54"/>
      <stop offset="0.55" stop-color="#333549"/>
      <stop offset="1" stop-color="#272838"/>
    </linearGradient>
    <linearGradient id="route" x1="700" y1="520" x2="970" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35B978"/>
      <stop offset="1" stop-color="#4ECB8D"/>
    </linearGradient>
  </defs>
